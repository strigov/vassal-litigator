<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="390" viewBox="0 0 1200 390"
     role="img" aria-labelledby="title desc">
  <title id="title">Путь судебного дела в Вассал-Литигаторе</title>
  <desc id="desc">Пять этапов: материалы, картина дела, позиция, заседание и обжалование.</desc>

  <rect width="1200" height="390" rx="26" fill="#15243B"/>

  <g transform="translate(58 50)">
    <text x="0" y="0"
          fill="#D9B765"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="18" font-weight="700" letter-spacing="3">РАБОЧИЙ МАРШРУТ</text>
    <text x="0" y="61"
          fill="#FFFFFF"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="46" font-weight="700">Одно дело. Пять последовательных этапов.</text>
  </g>

  <path d="M107 179H1093" fill="none" stroke="#6F7A8A" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(68 148)">
      <circle cx="39" cy="31" r="31" fill="#F4EFE6"/>
      <text x="39" y="40" fill="#7C2135" font-size="26" font-weight="750" text-anchor="middle">01</text>
      <text x="0" y="91" fill="#FFFFFF" font-size="24" font-weight="700">Материалы</text>
      <text x="0" y="125" fill="#C8CFD8" font-size="19">Приём · OCR</text>
      <text x="0" y="153" fill="#C8CFD8" font-size="19">Реестр документов</text>
      <rect x="0" y="178" width="155" height="3" fill="#7C2135"/>
    </g>

    <g transform="translate(286 148)">
      <circle cx="39" cy="31" r="31" fill="#F4EFE6"/>
      <text x="39" y="40" fill="#7C2135" font-size="26" font-weight="750" text-anchor="middle">02</text>
      <text x="0" y="91" fill="#FFFFFF" font-size="24" font-weight="700">Картина дела</text>
      <text x="0" y="125" fill="#C8CFD8" font-size="19">Факты · сроки</text>
      <text x="0" y="153" fill="#C8CFD8" font-size="19">Хронология</text>
      <rect x="0" y="178" width="155" height="3" fill="#7C2135"/>
    </g>

    <g transform="translate(504 148)">
      <circle cx="39" cy="31" r="31" fill="#F4EFE6"/>
      <text x="39" y="40" fill="#7C2135" font-size="26" font-weight="750" text-anchor="middle">03</text>
      <text x="0" y="91" fill="#FFFFFF" font-size="24" font-weight="700">Позиция</text>
      <text x="0" y="125" fill="#C8CFD8" font-size="19">Доводы · риски</text>
      <text x="0" y="153" fill="#C8CFD8" font-size="19">Доказательства</text>
      <rect x="0" y="178" width="155" height="3" fill="#7C2135"/>
    </g>

    <g transform="translate(722 148)">
      <circle cx="39" cy="31" r="31" fill="#F4EFE6"/>
      <text x="39" y="40" fill="#7C2135" font-size="26" font-weight="750" text-anchor="middle">04</text>
      <text x="0" y="91" fill="#FFFFFF" font-size="24" font-weight="700">Заседание</text>
      <text x="0" y="125" fill="#C8CFD8" font-size="19">Сценарий · тактика</text>
      <text x="0" y="153" fill="#C8CFD8" font-size="19">Ходатайства</text>
      <rect x="0" y="178" width="155" height="3" fill="#7C2135"/>
