    <g transform="translate(940 148)">
      <circle cx="39" cy="31" r="31" fill="#D9B765"/>
      <text x="39" y="40" fill="#15243B" font-size="26" font-weight="750" text-anchor="middle">05</text>
      <text x="0" y="91" fill="#FFFFFF" font-size="24" font-weight="700">Обжалование</text>
      <text x="0" y="125" fill="#C8CFD8" font-size="19">Проект решения</text>
      <text x="0" y="153" fill="#C8CFD8" font-size="19">Апелляция · кассация</text>
